<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIRMA Mongolia - Албан Ёсны Танилцуулга</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00b06b;
            --primary-dark: #008751;
            --bg-dark: #0b0f0e;
            --card-bg: #141c19;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #23302b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            background: rgba(11, 15, 14, 0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--primary);
        }

        /* Hero Section - Арын фоннд зураг оруулах хэсэг */
        .hero {
            background: linear-gradient(rgba(11, 15, 14, 0.75), rgba(11, 15, 14, 0.85)), url('image_1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
            padding: 8rem 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .hero-content {
            max-width: 850px;
            margin: 0 auto;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 3.2rem;
            margin-bottom: 1.2rem;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        }

        .hero p {
            color: #e5e7eb;
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .price-badge {
            display: inline-block;
            background: rgba(0, 176, 107, 0.25);
            backdrop-filter: blur(8px);
            border: 1px solid var(--primary);
            color: #ffffff;
            padding: 0.8rem 2.2rem;
            border-radius: 50px;
            font-size: 1.25rem;
            font-weight: 700;
            margin-top: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .import-banner {
            background: #121c17;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem;
            margin-bottom: 4rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .import-banner i {
            font-size: 3.5rem;
            color: var(--primary);
        }

        .import-banner h3 {
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 0.5px;
        }

        .import-banner p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .section-title p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2.5rem;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            padding: 0;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }
